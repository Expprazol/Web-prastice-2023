<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Page Layout</title>
</head>
<style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  padding: 20px;
}

/* Top section */
.top {
  display: flex;
  border: 2px solid #000;
  margin-bottom: 20px;
}

.logo {
  width: 20%;
  border-right: 2px solid #000;
  padding: 15px;
}

.nav {
  width: 80%;
  padding: 15px;
  text-align: center;
}

/* Banner */
.banner {
  border: 2px solid #000;
  padding: 30px;
  margin-bottom: 20px;
}

/* Main section */
.main {
  display: flex;
  border: 2px solid #000;
}

/* Sidebar */
.sidebar {
  width: 25%;
  border-right: 2px solid #000;
  padding: 20px;
}

/* Content */
.content {
  width: 75%;
  padding: 20px;
}

/* Footer */
.footer {
  border: 2px solid #000;
  border-top: none;
  padding: 15px;
  text-align: center;
}

</style>
<body>

  <!-- Top Section -->
  <div class="top">
    <div class="logo">Logo</div>
    <div class="nav">Navigation</div>
  </div>

  <!-- Header Banner -->
  <div class="banner">
    Header Banner (image)
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="sidebar">
      Side Bar <br>(News Lists)
    </div>

    <div class="content">
      Body Area <br>
      (introduction, table, image gallery)
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    Footer (some details)
  </div>

</body>
</html>
