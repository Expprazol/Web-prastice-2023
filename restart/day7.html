<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
img {
  transition: filter 0.3s ease, transform 0.3s ease;
}

img:hover {
  filter:
    brightness(1.1)
    contrast(1.2)
    saturate(1.35);
  transform: scale(1.02);
}


    
</style>
<body>
    <div>
        <img src="po.webp" alt="CSS Positioning Example">
    </div>
</body>
</html>
