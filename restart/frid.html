<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .hlo{
        height: 80px;
        width: 30vw;
        background-color: red;
        border: 2px solid black;
    }
    .main{
        width: 100vw;
        height: 100vh;
        border: 2px solid blue;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        justify-items: center;
        align-items: center;
       
    }
</style>
<body>
    <div class="main">
        <div class="hlo hlo1">1</div>
        <div class="hlo hlo2">2</div>
        <div class="hlo hlo3">3</div>
        <div class="hlo hlo4">4</div>
        <div class="hlo hlo5">5</div>
        <div class="hlo hlo6">6</div>
        <div class="hlo hlo7">7</div>
        <div class="hlo hlo8">8</div>
        <div class="hlo hlo9">9</div>

    </div>
</body>
</html>
