<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .main{
        background: #000;
        width: 80vw;
        height: 70vh;
    }
    .box{
        width: 100px;
        height: 100px;
        background: #ef0707;
        border-radius: 100px;
        border: 2px solid #ffffff;
        /* animation: animated;
        animation-duration: 1s;
        animation-iteration-count: 1;
        animation-timing-function: ease-out;
        animation-delay: 2s; */
        animation: animated 2s ease-in-out 1s infinite alternate;
        
    }
    @keyframes animated {
        from{
            transform: translate(0px);
            background-color: red;
        }
        to{
            transform: translate(425px);
            background-color: aqua;
        }
        
    }
    @keyframes anim {
        
        
    }
</style>
<body>
    <div class="main">
        <div class="box">Ball</div>
    </div>
</body>
</html>
